<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" width="640" height="440">
  <defs>
    <radialGradient id="bg" cx="70%" cy="35%" r="80%">
      <stop offset="0" stop-color="#2a1a12"/>
      <stop offset=".45" stop-color="#14161a"/>
      <stop offset="1" stop-color="#0b0d10"/>
    </radialGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff7a2e"/>
      <stop offset=".55" stop-color="#d9480f"/>
      <stop offset="1" stop-color="#5a1c06"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#fff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="mist" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ff8a3d" stop-opacity=".55"/>
      <stop offset="1" stop-color="#ff8a3d" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#fff" stroke-opacity=".04"/>
    </pattern>
  </defs>
  <rect width="640" height="440" fill="url(#bg)"/>
  <rect width="640" height="440" fill="url(#grid)"/>
  <!-- car fender panel -->
  <path d="M120 360 C150 250 250 170 400 150 C500 138 580 150 640 170 L640 440 L90 440 Z" fill="url(#panel)"/>
  <path d="M120 360 C150 250 250 170 400 150 C500 138 580 150 640 170" fill="none" stroke="#ffd2b0" stroke-opacity=".7" stroke-width="2"/>
  <path d="M190 300 C260 230 360 200 520 200" fill="none" stroke="url(#gloss)" stroke-width="10" stroke-linecap="round" opacity=".8"/>
  <!-- wheel arch -->
  <path d="M300 440 A150 150 0 0 1 600 440" fill="#0b0d10"/>
  <path d="M300 440 A150 150 0 0 1 600 440" fill="none" stroke="#000" stroke-opacity=".5" stroke-width="12"/>
  <!-- mist -->
  <ellipse cx="300" cy="170" rx="170" ry="90" fill="url(#mist)"/>
  <g fill="#ffb487">
    <circle cx="260" cy="150" r="2.4"/><circle cx="300" cy="180" r="1.8"/><circle cx="330" cy="140" r="2"/>
    <circle cx="350" cy="190" r="1.6"/><circle cx="380" cy="160" r="2.2"/><circle cx="240" cy="190" r="1.5"/>
    <circle cx="410" cy="200" r="1.4"/><circle cx="290" cy="120" r="1.6"/><circle cx="360" cy="120" r="1.3"/>
  </g>
  <!-- spray gun -->
  <g transform="translate(70 70) rotate(18)">
    <rect x="0" y="40" width="120" height="34" rx="12" fill="#1d2127" stroke="#e9e6e1" stroke-opacity=".75" stroke-width="2"/>
    <rect x="118" y="48" width="38" height="18" rx="4" fill="#2a2f37" stroke="#e9e6e1" stroke-opacity=".75" stroke-width="2"/>
    <circle cx="160" cy="57" r="5" fill="#ff6a1a"/>
    <path d="M40 0 h40 l6 40 h-52 z" fill="#2a2f37" stroke="#e9e6e1" stroke-opacity=".75" stroke-width="2"/>
    <path d="M30 74 l-10 70 h30 l10 -70" fill="#1d2127" stroke="#e9e6e1" stroke-opacity=".75" stroke-width="2"/>
    <path d="M70 74 q14 30 -6 50" fill="none" stroke="#ff6a1a" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>
