<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" width="640" height="440">
  <defs>
    <radialGradient id="bg" cx="40%" cy="45%" r="80%">
      <stop offset="0" stop-color="#14263a"/>
      <stop offset="1" stop-color="#0b0d10"/>
    </radialGradient>
    <radialGradient id="cold" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#7cc4ff" stop-opacity=".5"/>
      <stop offset="1" stop-color="#7cc4ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="vent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c323b"/>
      <stop offset="1" stop-color="#15181d"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#fff" stroke-opacity=".04"/>
    </pattern>
  </defs>
  <rect width="640" height="440" fill="url(#bg)"/>
  <rect width="640" height="440" fill="url(#grid)"/>
  <!-- dashboard vent -->
  <rect x="60" y="140" width="240" height="160" rx="30" fill="url(#vent)" stroke="#e9e6e1" stroke-opacity=".4" stroke-width="2"/>
  <g stroke="#e9e6e1" stroke-opacity=".55" stroke-width="6" stroke-linecap="round">
    <path d="M90 175 h180"/><path d="M90 205 h180"/><path d="M90 235 h180"/><path d="M90 265 h180"/>
  </g>
  <rect x="168" y="160" width="24" height="120" rx="6" fill="#ff6a1a"/>
  <!-- airflow -->
  <ellipse cx="430" cy="220" rx="190" ry="130" fill="url(#cold)"/>
  <g fill="none" stroke="#a9dbff" stroke-linecap="round">
    <path d="M310 180 C380 170 420 130 500 140" stroke-width="3" stroke-opacity=".8"/>
    <path d="M310 220 C390 220 440 200 560 210" stroke-width="3" stroke-opacity=".6"/>
    <path d="M310 260 C380 270 430 300 520 290" stroke-width="3" stroke-opacity=".45"/>
  </g>
  <!-- snowflake -->
  <g transform="translate(470 200)" stroke="#e9f6ff" stroke-width="5" stroke-linecap="round" fill="none">
    <g id="arm"><path d="M0 0 V-70"/><path d="M0 -44 l-16 -16 M0 -44 l16 -16"/><path d="M0 -24 l-10 -10 M0 -24 l10 -10"/></g>
    <use href="#arm" transform="rotate(60)"/><use href="#arm" transform="rotate(120)"/>
    <use href="#arm" transform="rotate(180)"/><use href="#arm" transform="rotate(240)"/><use href="#arm" transform="rotate(300)"/>
    <circle r="8" fill="#ff6a1a" stroke="none"/>
  </g>
  <g font-family="Manrope, Arial, sans-serif" fill="#e9e6e1">
    <text x="80" y="350" font-size="40" font-weight="700">18°</text>
    <text x="150" y="350" font-size="12" fill-opacity=".6" letter-spacing="2">AUTO · R1234YF</text>
  </g>
</svg>
