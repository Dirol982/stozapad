<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" width="640" height="440">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="80%">
      <stop offset="0" stop-color="#1a2230"/>
      <stop offset="1" stop-color="#0b0d10"/>
    </radialGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#121821"/>
      <stop offset="1" stop-color="#0a0e13"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff6a1a" stop-opacity=".2"/>
      <stop offset=".6" stop-color="#ff6a1a"/>
      <stop offset="1" stop-color="#ffc59e"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#fff" stroke-opacity=".04"/>
    </pattern>
    <pattern id="sgrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#7aa2ff" stroke-opacity=".08"/>
    </pattern>
  </defs>
  <rect width="640" height="440" fill="url(#bg)"/>
  <rect width="640" height="440" fill="url(#grid)"/>
  <!-- tablet -->
  <rect x="90" y="70" width="400" height="280" rx="22" fill="#1d2127" stroke="#e9e6e1" stroke-opacity=".45" stroke-width="2"/>
  <rect x="110" y="90" width="360" height="240" rx="10" fill="url(#screen)"/>
  <rect x="110" y="90" width="360" height="240" rx="10" fill="url(#sgrid)"/>
  <g font-family="Manrope, Arial, sans-serif">
    <text x="130" y="122" fill="#e9e6e1" fill-opacity=".55" font-size="12" letter-spacing="2">ЭБУ · ДВИГАТЕЛЬ</text>
    <text x="130" y="160" fill="#e9e6e1" font-size="32" font-weight="700">2 450</text>
    <text x="232" y="160" fill="#e9e6e1" fill-opacity=".55" font-size="14">об/мин</text>
    <text x="360" y="122" fill="#3ddc97" font-size="12" letter-spacing="1">● ОШИБОК: 0</text>
  </g>
  <path d="M120 270 C150 270 160 220 190 220 S230 290 260 280 S300 200 330 210 S370 260 400 240 S440 190 460 200" fill="none" stroke="url(#wave)" stroke-width="3" stroke-linecap="round"/>
  <path d="M120 300 C160 296 200 304 240 296 S320 290 360 300 S430 292 460 296" fill="none" stroke="#7aa2ff" stroke-opacity=".6" stroke-width="2"/>
  <!-- cable & OBD plug -->
  <path d="M490 220 C560 220 560 330 520 360 S470 410 540 420" fill="none" stroke="#2f343c" stroke-width="10" stroke-linecap="round"/>
  <path d="M490 220 C560 220 560 330 520 360 S470 410 540 420" fill="none" stroke="#e9e6e1" stroke-opacity=".25" stroke-width="2"/>
  <g transform="translate(520 380)">
    <path d="M0 10 h90 l-10 50 h-70 z" fill="#2a2f37" stroke="#e9e6e1" stroke-opacity=".6" stroke-width="2"/>
    <g fill="#ff6a1a"><circle cx="22" cy="26" r="3"/><circle cx="36" cy="26" r="3"/><circle cx="50" cy="26" r="3"/><circle cx="64" cy="26" r="3"/>
    <circle cx="28" cy="40" r="3"/><circle cx="42" cy="40" r="3"/><circle cx="56" cy="40" r="3"/></g>
  </g>
  <circle cx="290" cy="340" r="4" fill="#e9e6e1" fill-opacity=".4"/>
</svg>
