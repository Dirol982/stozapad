<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" width="640" height="440">
  <defs>
    <radialGradient id="bg" cx="45%" cy="50%" r="80%">
      <stop offset="0" stop-color="#1b2028"/>
      <stop offset="1" stop-color="#0b0d10"/>
    </radialGradient>
    <radialGradient id="tire" cx="50%" cy="50%" r="50%">
      <stop offset=".62" stop-color="#15181d"/>
      <stop offset=".9" stop-color="#23272e"/>
      <stop offset="1" stop-color="#0f1114"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4f1ec"/>
      <stop offset=".5" stop-color="#8b9099"/>
      <stop offset="1" stop-color="#2e333b"/>
    </linearGradient>
    <linearGradient id="laser" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff6a1a" stop-opacity="0"/>
      <stop offset=".5" stop-color="#ff6a1a"/>
      <stop offset="1" stop-color="#ff6a1a" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#fff" stroke-opacity=".04"/>
    </pattern>
  </defs>
  <rect width="640" height="440" fill="url(#bg)"/>
  <rect width="640" height="440" fill="url(#grid)"/>
  <!-- 3D target plates -->
  <g stroke="#e9e6e1" stroke-opacity=".35" fill="none">
    <rect x="470" y="110" width="120" height="120" rx="8"/>
    <g fill="#e9e6e1" fill-opacity=".55" stroke="none">
      <circle cx="495" cy="135" r="7"/><circle cx="530" cy="135" r="7"/><circle cx="565" cy="135" r="7"/>
      <circle cx="495" cy="170" r="7"/><circle cx="565" cy="170" r="7"/>
      <circle cx="495" cy="205" r="7"/><circle cx="530" cy="205" r="7"/><circle cx="565" cy="205" r="7"/>
    </g>
  </g>
  <!-- laser beams -->
  <path d="M60 220 L470 170" stroke="url(#laser)" stroke-width="2"/>
  <path d="M60 260 L470 210" stroke="url(#laser)" stroke-width="1.4" opacity=".7"/>
  <!-- wheel -->
  <g transform="translate(250 230)">
    <circle r="160" fill="url(#tire)"/>
    <g stroke="#000" stroke-opacity=".45" stroke-width="5">
      <path d="M0 -160 v16"/><path d="M0 160 v-16"/><path d="M-160 0 h16"/><path d="M160 0 h-16"/>
      <path d="M113 -113 l-11 11"/><path d="M-113 113 l11 -11"/><path d="M113 113 l-11 -11"/><path d="M-113 -113 l11 11"/>
    </g>
    <circle r="104" fill="url(#rim)"/>
    <circle r="96" fill="#14171c"/>
    <g fill="url(#rim)">
      <path d="M-9 -92 L9 -92 L12 -18 L-12 -18 Z"/>
      <path d="M-9 -92 L9 -92 L12 -18 L-12 -18 Z" transform="rotate(72)"/>
      <path d="M-9 -92 L9 -92 L12 -18 L-12 -18 Z" transform="rotate(144)"/>
      <path d="M-9 -92 L9 -92 L12 -18 L-12 -18 Z" transform="rotate(216)"/>
      <path d="M-9 -92 L9 -92 L12 -18 L-12 -18 Z" transform="rotate(288)"/>
    </g>
    <circle r="62" fill="none" stroke="#ff6a1a" stroke-width="10" stroke-opacity=".9"/>
    <circle r="24" fill="#2a2f37" stroke="#e9e6e1" stroke-opacity=".6" stroke-width="2"/>
    <circle r="8" fill="#ff6a1a"/>
  </g>
  <!-- angle readout -->
  <g font-family="Manrope, Arial, sans-serif" fill="#e9e6e1">
    <path d="M250 40 v60 M250 40 l38 58" stroke="#ff6a1a" stroke-width="2" fill="none"/>
    <path d="M250 80 a20 20 0 0 1 12 4" stroke="#ff6a1a" stroke-width="2" fill="none"/>
    <text x="298" y="70" font-size="22" font-weight="700">0°12′</text>
    <text x="298" y="92" font-size="12" fill-opacity=".6" letter-spacing="2">РАЗВАЛ</text>
  </g>
</svg>
